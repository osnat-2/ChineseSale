<section class="home-page">
  <div class="home-hero">
    <p class="eyebrow">{{ 'home.eyebrow' | translate }}</p>
    <h1>{{ 'home.title' | translate }}</h1>
    <p class="home-intro">{{ 'home.intro' | translate }}</p>
    <a class="primary-link" routerLink="/catalog">{{ 'home.browse' | translate }}</a>
  </div>

  <aside class="home-account">
    <p class="eyebrow">{{ 'home.account' | translate }}</p>
    <p>{{ 'home.accountIntro' | translate }}</p>
    <div class="home-account-actions">
      <a routerLink="/login">{{ 'home.login' | translate }}</a>
      <a routerLink="/register">{{ 'home.register' | translate }}</a>
    </div>
  </aside>
</section>
