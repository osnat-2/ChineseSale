<main class="catalog-page">
  <header class="catalog-header">
    <p class="eyebrow">Chinese Sale</p>
    <h1>Find a present worth winning</h1>
    <p class="intro">Browse the active presents in this year's sale.</p>
  </header>

  <form class="filters" (ngSubmit)="loadPresents()" aria-label="Catalogue filters">
    <label>
      Search presents
      <input type="search" name="search" [(ngModel)]="search" placeholder="Name or description" />
    </label>
    <label>
      Category
      <select name="category" [(ngModel)]="categoryId">
        <option value="">All categories</option>
        <option *ngFor="let category of categories" [value]="category.id">{{ category.name }}</option>
      </select>
    </label>
    <label>
      Sort by
      <select name="sortBy" [(ngModel)]="sortBy">
        <option value="name">Name</option>
        <option value="price">Price</option>
      </select>
    </label>
    <label>
      Direction
      <select name="sortDirection" [(ngModel)]="sortDirection">
        <option value="asc">Ascending</option>
        <option value="desc">Descending</option>
      </select>
    </label>
    <button type="submit">Apply filters</button>
  </form>

  <p *ngIf="loading" class="state" role="status">Loading presents...</p>
  <p *ngIf="!loading && errorMessage" class="state state-error" role="alert">{{ errorMessage }}</p>
  <p *ngIf="!loading && !errorMessage && presents.length === 0" class="state">No presents match these filters.</p>

  <section *ngIf="!loading && !errorMessage && presents.length" class="present-grid" aria-label="Available presents">
    <article *ngFor="let present of presents" class="present-card">
      <img [src]="present.imageUrl || 'assets/images/present-placeholder.svg'" [alt]="present.name" (error)="imageFallback($event)" />
      <div class="present-card-body">
        <p class="card-label">Present</p>
        <h2>{{ present.name }}</h2>
        <p>{{ present.description }}</p>
        <div class="card-footer">
          <strong>{{ present.price | currency }}</strong>
          <a [routerLink]="['/catalog', present.id]">View details</a>
        </div>
      </div>
    </article>
  </section>
</main>
